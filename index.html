<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#285c3d" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>CHAEN POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">CHAEN</div>
      <div class="sub">POS SYSTEM</div>
    </div>
    <div id="clock" class="clock"></div>
  </header>

  <main id="app" class="app"></main>

  <nav class="nav">
    <button data-view="home">HOME</button>
    <button class="nav-order" data-view="order"><span class="nav-label">ORDER</span><span class="order-badge" data-order-badge hidden>0</span></button>
    <button data-view="expense">EXPENSE</button>
    <button data-view="report">REPORT</button>
    <button data-view="history">HISTORY</button>
  </nav>

  <script src="recipes.js"></script>
  <script src="sheet-sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
